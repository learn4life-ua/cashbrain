<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Фінансова подушка — CASHBRAIN</title>

  <style>
    :root {
      --green: #1C5345;
      --green-dark: #174A3D;
      --accent: #62C96B;
      --soft: #DFF6DF;
      --background: #F7F9F6;
      --white: #FFFFFF;
      --text: #10231C;
      --muted: #63736D;
      --border: #DDE7E0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(98, 201, 107, 0.18),
          transparent 30%
        ),
        var(--background);
      color: var(--text);
      font-family: Inter, Manrope, "Segoe UI", Arial, sans-serif;
    }

    .card {
      width: min(760px, 100%);
      padding: 46px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--white);
      box-shadow: 0 20px 50px rgba(23, 74, 61, 0.1);
    }

    .label {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 72px);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 620px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      margin-top: 28px;
      padding: 9px 13px;
      border-radius: 999px;
      background: #EFFAF0;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    @media (max-width: 640px) {
      .card {
        padding: 30px 22px;
        border-radius: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="label">Симулятор CASHBRAIN</div>

    <h1>Фінансова подушка</h1>

    <p>
      Інтерактивний симулятор допоможе визначити необхідний розмір
      фінансового резерву, обрати темп накопичення та перевірити,
      на скільки місяців вистачить подушки у разі втрати доходу.
    </p>

    <div class="status">Симулятор готується</div>
  </main>
</body>
</html>
