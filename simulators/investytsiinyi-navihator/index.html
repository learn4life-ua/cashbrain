<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174A3D"><title>Інвестиційний навігатор - CASHBRAIN</title><link rel="icon" href="../../assets/cashbrain-logo.png"><style>
:root{--g:#1C5345;--gd:#174A3D;--a:#62C96B;--s:#DFF6DF;--bg:#F7F9F6;--t:#10231C;--m:#63736D;--b:#DDE7E0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,Manrope,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.top{padding:18px 0;background:#103A31;color:white}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.top a{font-size:13px;color:#DFF6DF}.hero{padding:64px 0 48px;background:var(--gd);color:white}.tag{font-size:11px;font-weight:900;letter-spacing:.12em;color:#A8E7AD;text-transform:uppercase}h1{margin:12px 0;font-size:clamp(38px,7vw,68px);line-height:1;letter-spacing:-.045em}.lead{max-width:760px;margin:0;color:#D8E5E0;line-height:1.65}.main{padding:42px 0 68px}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:start}.panel{padding:26px;border:1px solid var(--b);border-radius:20px;background:white;box-shadow:0 12px 34px rgba(23,74,61,.07)}h2{margin:0 0 18px;font-size:25px}.field{margin:0 0 16px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}.field input,.field select{width:100%;min-height:46px;padding:10px 12px;border:1px solid #BDD0C4;border-radius:11px;background:white;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--gd);color:white;font-weight:900;cursor:pointer}.result{position:sticky;top:18px}.metric{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid var(--b)}.metric strong{text-align:right}.note{margin-top:18px;padding:16px;border-radius:12px;background:var(--s);color:#315A4D;line-height:1.55}.choices{display:grid;gap:10px}.choice{padding:15px;border:1px solid var(--b);border-radius:12px;background:white;text-align:left;font:inherit;cursor:pointer}.choice:hover,.choice.active{border-color:var(--a);background:#F1FAF2}.footer{padding:25px 0;background:#103A31;color:#BDD0C8;font-size:12px}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.hero{padding:46px 0 36px}.main{padding-top:26px}.panel{padding:20px}.result{position:static}}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="../../">CASHBRAIN</a><a href="../">← До розділу</a></div></header><section class="hero"><div class="wrap"><div class="tag">Симулятор · Маршрут 08</div><h1>Інвестиційний навігатор</h1><p class="lead">Порівняйте прості й складні проценти та оцініть, як інфляція змінює реальну вартість результату.</p></div></section><main class="main"><div class="wrap"><div class="grid"><section class="panel"><h2>Задайте умови</h2><div class="field"><label>Початкова сума, грн</label><input id="sum" type="number" min="0" value="20000"></div><div class="row"><div class="field"><label>Річна ставка, %</label><input id="rate" type="number" min="0" step=".1" value="12"></div><div class="field"><label>Строк, років</label><input id="years" type="number" min="1" max="30" value="5"></div></div><div class="row"><div class="field"><label>Інфляція, % на рік</label><input id="infl" type="number" min="0" step=".1" value="8"></div><div class="field"><label>Рівень ризику</label><select id="risk"><option>Низький</option><option selected>Середній</option><option>Високий</option></select></div></div><button class="btn" onclick="calc()">Побудувати порівняння</button></section><aside class="panel result"><h2>Порівняння</h2><div class="metric"><span>Прості проценти</span><strong id="simple"></strong></div><div class="metric"><span>Складні проценти</span><strong id="compound"></strong></div><div class="metric"><span>Реальна вартість</span><strong id="real"></strong></div><div class="note" id="advice"></div></aside></div></div></main><footer class="footer"><div class="wrap">CASHBRAIN · Мистецтво розумних рішень</div></footer><script>const v=id=>Math.max(0,Number(document.getElementById(id).value)||0),m=x=>Math.round(x).toLocaleString('uk-UA')+' грн';function calc(){let s=v('sum'),r=v('rate')/100,y=v('years'),i=v('infl')/100,sp=s*(1+r*y),cp=s*Math.pow(1+r,y),rv=cp/Math.pow(1+i,y);simple.textContent=m(sp);compound.textContent=m(cp);real.textContent=m(rv);advice.textContent='Ризик: '+document.getElementById('risk').value+'. Вища очікувана дохідність не є гарантією результату. Порівнюйте ліквідність, комісії, податки та можливість втрати коштів.'}calc();</script></body></html>
