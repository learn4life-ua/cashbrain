<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Перша зарплата — CASHBRAIN</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F7F9F6;
      color: #10231C;
      font-family: Inter, Manrope, "Segoe UI", Arial, sans-serif;
    }

    .card {
      width: min(720px, 100%);
      padding: 40px;
      border: 1px solid #DDE7E0;
      border-radius: 24px;
      background: #FFFFFF;
      text-align: center;
      box-shadow: 0 18px 40px rgba(23, 74, 61, 0.1);
    }

    .label {
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #DFF6DF;
      color: #1C5345;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(42px, 7vw, 68px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0;
      color: #63736D;
      font-size: 15px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="label">Симулятор CASHBRAIN</div>

    <h1>Перша зарплата</h1>

    <p>
      Симулятор розрахунку податків, зарплати до виплати,
      щомісячних витрат і першого плану заощаджень готується.
    </p>
  </main>
</body>
</html>
